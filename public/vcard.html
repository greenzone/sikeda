<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kartu Anggota — SIKEDA</title>
<meta property="og:type" content="profile">
<meta property="og:title" content="Kartu Anggota — SIKEDA">
<meta property="og:description" content="Kartu anggota digital terverifikasi DPD Nusantara Bersatu.">
<meta property="og:image" content="/share-card/preview">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/sikeda.css?v=pg10">
<link rel="stylesheet" href="assets/css/kta-card.css?v=pg10">
<style>
  .vc-tile{background:var(--paper-dim);border-radius:var(--r-m);padding:12px 14px;}
  .vc-tile .t-label{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}
  .vc-tile .t-value{font-weight:700;font-size:.92rem;margin-top:2px;}
  /* ---------- layout preview lebar: kartu ID-1 landscape butuh ruang ---------- */
  .vc-wrap{width:100%;max-width:960px;margin:0 auto;}
  /* ---------- flip kartu fisik ---------- */
  .flip-card{perspective:1600px;max-width:860px;margin-left:auto;margin-right:auto;width:100%;}
  .flip-inner{transition:transform .6s cubic-bezier(.2,.9,.3,1);transform-style:preserve-3d;position:relative;}
  .flip-card.is-flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  .flip-face .kta-card{height:100%;width:100%;}
  .flip-face .kta-face{display:flex;}
  .flip-back{position:absolute;inset:0;transform:rotateY(180deg);}
  .flip-face .kta-card{box-shadow:0 18px 44px -18px rgba(23,16,0,.45);}
  @media (max-width:720px){
    .flip-card{max-width:100%;}
  }
</style>
</head>
<body>

<!-- ===================== App bar ===================== -->
<header class="site-header">
  <div class="appbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 6.5V11c0 5.2 3.6 9.9 9 11 5.4-1.1 9-5.8 9-11V6.5L12 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </span>
      <span>
        <span class="brand-name" style="display:block;">SIKEDA</span>
        <span class="brand-sub">Kartu anggota digital</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Beranda</a>
      <a href="dashboard.html?role=anggota">Dashboard</a>
    </nav>
  </div>
</header>

<main class="container" style="max-width:1000px;padding-top:36px;padding-bottom:72px;">
  <div id="vcRoot" class="vc-wrap">
    <!-- diisi oleh JS -->
  </div>
</main>

<script src="assets/js/sikeda.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/branding.js"></script>
<script>
  var ROOT = document.getElementById('vcRoot');
  var m = null;
  var ORG = { nama:'DPD Nusantara Bersatu', wilayah:'Kabupaten Tulungagung' };

  /* Identitas organisasi dari pengaturan (fallback bila gagal) */
  (async function loadOrg(){
    try {
      var b = await SIKAPI.get('/public/branding');
      if(b && b.data){
        if(b.data.org_nama)    ORG.nama    = b.data.org_nama;
        if(b.data.org_wilayah) ORG.wilayah = b.data.org_wilayah;
      }
    } catch(e){ /* pakai default */ }
  })();

  /* Ambil data dari API; fallback profil sendiri untuk anggota tanpa ?id= */
  (async function init(){
    if(!SIKAPI.token()){
      ROOT.innerHTML = '<div class="empty card"><svg width="44" height="44" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.5"/></svg><strong>Perlu login</strong>Halaman vCard hanya dapat dilihat anggota/pengelola yang sudah masuk.</div>'
        + '<div class="center mt-16"><a class="btn btn-primary" href="login.html">Masuk sekarang</a></div>';
      return;
    }
    try {
      var kode = SIK.param('id');
      var res;
      if(kode){
        res = await SIKAPI.get('/vcard/' + encodeURIComponent(kode));
        m = res.data;
      } else {
        res = await SIKAPI.get('/me/profile');
        m = res.data;
      }
      m.url = location.origin + '/kta/' + m.kode_unik.toLowerCase();
      /* Perbarui meta OG dinamis — share ke medsos memakai kartu terender server */
      try {
        var shortName = m.nama.split(' ').slice(0, 2).join(' ');
        document.title = shortName + ' — Kartu Anggota SIKEDA';
        document.querySelector('meta[property="og:title"]').content = shortName + ' — Anggota Terverifikasi';
        document.querySelector('meta[property="og:description"]').content = (m.jabatan || 'Anggota') + ' · ' + m.kecamatan + ' — terverifikasi resmi DPD Nusantara Bersatu.';
        document.querySelector('meta[property="og:image"]').content = location.origin + '/share-card/' + m.kode_unik;
        document.querySelector('meta[property="og:url"]').content = m.url;
      } catch(e){}
      render(m);
    } catch(e){
      ROOT.innerHTML = '<div class="empty card"><strong>' + SIK.escape(e.message) + '</strong>Kartu tidak ditemukan atau keanggotaan tidak aktif.</div>';
    }
  })();

  function fotoImg(src, alt){
    /* Inisial selalu dirender di belakang foto — jika foto gagal dimuat,
       img dihapus dan inisial tampil (tidak pernah kotak kosong). */
    var ini = '<span class="kf-ini">' + SIK.initials(alt) + '</span>';
    if(src) return ini + '<img src="' + SIK.escape(src) + '?v=' + Date.now() + '" alt="' + SIK.escape(alt) + '" onerror="this.remove()">';
    return ini;
  }

  function render(m){
    /* Masa berlaku = terdaftar + 3 tahun (sama dengan aturan cetak PDF) */
    var expDate = new Date(String(m.registered_at).slice(0,10) + 'T00:00:00');
    if(!isNaN(expDate)) expDate.setFullYear(expDate.getFullYear() + 3);
    var expLabel = isNaN(expDate) ? '—' : expDate.toLocaleDateString('id-ID', { month:'short', year:'numeric' });
    var foto = m.foto_path || '';
    var npapg = m.npapg || '';
    /* Baris wilayah sesuai referensi fisik:
       baris 1 = Desa - Kecamatan, baris 2 = wilayah organisasi (Kab - Prov) */
    var desa = m.desa || '';
    var kec = m.kecamatan || '';
    var lineDesa = (desa && kec) ? (desa + ' - ' + kec) : (desa || kec || '—');
    var lineWil = ORG.wilayah || kec || '';

    ROOT.innerHTML =
      /* ============================================================
         PRATINJAU KARTU FISIK — di atas, tombol flip di bawahnya
         ============================================================ */
      '<h2 class="display-m">Pratinjau kartu fisik</h2>'
      + '<p class="muted small mt-8">Ukuran ID-1 (85,6 × 54 mm) · NPAPG memakai NIK pendaftar · siap cetak massal dari dashboard pengelola.</p>'
      + '<div class="flip-card mt-16" id="flipCard">'
      + '  <div class="flip-inner">'
      + '    <div class="flip-face">'
      + '      <div class="kta-card">'
      + '      <div class="kta-face kta-front">'
      + '        <div class="kf-qr" id="pcQrFront"></div>'
      + '        <div class="kf-org">' + SIK.escape(ORG.nama) + '</div>'
      + '        <div class="kf-sub">' + SIK.escape(ORG.wilayah) + '</div>'
      + '        <div class="kf-photo">' + fotoImg(foto, m.nama) + '</div>'
      + '        <div class="kf-data">'
      + '          <div class="kf-nama">' + SIK.escape(m.nama) + '</div>'
      + '          <div class="kf-npapg"><span class="lbl">NPAPG</span>' + SIK.escape(npapg || '••••••••••••••••') + '</div>'
      + '          <div class="kf-wil">' + SIK.escape(lineDesa) + '</div>'
      + '          <div class="kf-wil2">' + SIK.escape(lineWil) + '</div>'
      + '        </div>'
      + '        <div class="kf-code"><div class="rule"></div><div class="val" id="pcTitleFront">Kartu Tanda Anggota</div></div>'
      + '      </div>'
      + '      </div>'
      + '    </div>'
      + '    <div class="flip-face flip-back">'
      + '      <div class="kta-card">'
      + '      <div class="kta-face kta-back">'
      + '        <div class="kb-top"><span class="t" id="pcTitleBack">Kartu Tanda Anggota</span><span class="o">' + SIK.escape(ORG.nama) + '</span></div>'
      + '        <div class="kb-toprule"></div>'
      + '        <div class="kb-mag"></div>'
      + '        <div class="kb-body">'
      + '          <div class="kb-qrwrap"><div class="kb-qr" id="pcQrBack"></div><div class="kb-qrhint">Pindai untuk verifikasi</div></div>'
      + '          <div class="kb-info">'
      + '            <div class="kb-nama">' + SIK.escape(m.nama) + '</div>'
      + '            <div class="kb-role">' + SIK.escape(m.jabatan) + ' · ' + SIK.escape(m.desa) + ', ' + SIK.escape(m.kecamatan) + '</div>'
      + '            <div class="kb-chips">'
      + '              <div class="kb-chip"><span class="k">NPAPG</span><span class="v">' + SIK.escape(npapg || '—') + '</span></div>'
      + '              <div class="kb-chip"><span class="k">No. Kartu</span><span class="v">' + SIK.escape(m.kode_unik) + '</span></div>'
      + '            </div>'
      + '            <div class="kb-url">' + SIK.escape(m.url.replace(/^https?:\/\//, '')) + '</div>'
      + '          </div>'
      + '          <div class="kb-sealcol">'
      + '            <div class="kb-seal"><span class="s1">✓</span><span class="s2">Resmi</span></div>'
      + '            <div class="kb-valid"><span class="k">SD</span> ' + SIK.escape(expLabel) + '</div>'
      + '          </div>'
      + '        </div>'
      + '        <div class="kb-note">Kartu ini milik ' + SIK.escape(m.nama) + ' dan tidak dapat dipindahtangankan. Laporkan kehilangan kepada pengurus DPC setempat.</div>'
      + '        <div class="kb-strip">Diterbitkan ' + SIK.escape(ORG.nama) + ' — SIKEDA</div>'
      + '      </div>'
      + '      </div>'
      + '    </div>'
      + '  </div>'
      + '</div>'

      /* ---------- Aksi — tepat di bawah pratinjau ---------- */
      + '<div class="grid-3 mt-16" style="grid-template-columns:repeat(3,1fr);">'
      + '  <button class="btn btn-primary" onclick="saveVcf()">'
      + '    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
      + '    Simpan Kontak'
      + '  </button>'
      + '  <button class="btn btn-soft" onclick="shareLink()">Bagikan</button>'
      + '  <button class="btn btn-soft" onclick="cetakPdf(this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 17h12m-8-8v2m0-9V5m4 4h4m-4 4h2m-10 8h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Cetak PDF</button>'
      + '  <button class="btn btn-outline btn-block mt-8" style="grid-column:1/-1;" onclick="flipCard(this)">'
      + '    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 9a8 8 0 0 1 14-3M20 15a8 8 0 0 1-14 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18 3v3.5h-3.5M6 21v-3.5h3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + '    <span>Lihat sisi belakang kartu</span>'
      + '  </button>'
      + '</div>'

      /* ---------- Detail anggota ---------- */
      + '<div class="card mt-24">'
      + '  <div class="card-pad" style="padding-bottom:12px;">'
      + '    <h2 class="display-s">Data keanggotaan</h2>'
      + '  </div>'
      + '  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 20px;">'
      + '    <div class="vc-tile"><div class="t-label">Nama</div><div class="t-value">' + SIK.escape(m.nama) + '</div></div>'
      + '    <div class="vc-tile"><div class="t-label">ID Anggota</div><div class="t-value mono">' + SIK.escape(m.kode_unik) + '</div></div>'
      + '    <div class="vc-tile"><div class="t-label">NPAPG</div><div class="t-value mono">' + SIK.escape(npapg || '—') + '</div></div>'
      + '    <div class="vc-tile"><div class="t-label">Jabatan</div><div class="t-value">' + SIK.escape(m.jabatan) + '</div></div>'
      + '    <div class="vc-tile"><div class="t-label">Ranting / Desa</div><div class="t-value">' + SIK.escape(m.desa) + '</div></div>'
      + '    <div class="vc-tile"><div class="t-label">Kecamatan (DPC)</div><div class="t-value">' + SIK.escape(m.kecamatan) + '</div></div>'
      + '    <div class="vc-tile"><div class="t-label">Status</div><div class="t-value"><span class="badge ' + (m.status === 'Aktif' ? 'badge-success' : 'badge-warn') + '"><span class="dot"></span> ' + SIK.escape(m.status) + '</span></div></div>'
      + '    <div class="vc-tile"><div class="t-label">Terdaftar sejak</div><div class="t-value">' + SIK.fmtDate(String(m.registered_at).slice(0,10)) + '</div></div>'
      + '    <div class="vc-tile"><div class="t-label">Masa berlaku</div><div class="t-value">' + expLabel + '</div></div>'
      + '  </div>'
      + '</div>'

      /* ---------- Info keamanan ---------- */
      + '<div class="card card-pad mt-16" style="background:var(--paper-dim);border-color:var(--line);">'
      + '  <div class="row gap-8" style="align-items:flex-start;">'
      + '    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="color:var(--gold-600);flex-shrink:0;margin-top:2px;"><path d="M12 2L4 5v6c0 5.1 3.4 9.7 8 11 4.6-1.3 8-5.9 8-11V5l-8-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + '    <span class="small muted" style="line-height:1.6;">'
      + '      Data sensitif (alamat lengkap, dokumen) <strong>tidak ditampilkan</strong> di halaman vCard. '
      + '      URL memakai ID unik non-berurutan agar tidak mudah ditebak.'
      + '    </span>'
      + '  </div>'
      + '</div>'

      + '<p class="center tiny faint mt-24">Demo prototipe — halaman ini mewakili URL publik-internal <span class="mono">/kta/{id-unik}</span></p>';

    /* QR sistem menuju URL vCard — hitam pekat, sama seperti QR di PDF */
    document.getElementById('pcQrFront').innerHTML = SIK.qr(m.url, { scale: 4, size: 96, dark: '#000000' });
    document.getElementById('pcQrBack').innerHTML  = SIK.qr(m.url, { scale: 6, size: 168, dark: '#000000' });

    /* Terapkan desain kartu aktif (menu Desain Kartu di dashboard) —
       pratinjau halaman ini mengikuti persis template yang dipakai PDF cetak. */
    (async () => {
      try {
        var d = await (await fetch('/api/vcard/design')).json();
        if(d && d.css){
          var st = document.createElement('style');
          st.id = 'ktaDesignOverride';
          st.textContent = d.css;
          document.head.appendChild(st);
        }
        if(d){
          var tf = document.getElementById('pcTitleFront');
          if(tf && d.front && d.front.title_text) tf.textContent = d.front.title_text;
          var tb = document.getElementById('pcTitleBack');
          if(tb && d.back && d.back.header_text) tb.textContent = d.back.header_text;
        }
      } catch(e){ /* fallback: tetap pakai desain bawaan */ }
    })();
  }

  /* ---------- Flip kartu fisik (depan ↔ belakang) ---------- */
  function flipCard(btn){
    var card = document.getElementById('flipCard');
    if(!card) return;
    card.classList.toggle('is-flipped');
    var flipped = card.classList.contains('is-flipped');
    var span = btn ? btn.querySelector('span') : null;
    if(span) span.textContent = flipped ? 'Lihat sisi depan kartu' : 'Lihat sisi belakang kartu';
  }

  /* ---------- Overlay progres pembuatan PDF ---------- */
  var pdfProgress = null;
  function pdfProgressShow(){
    pdfProgressHide();
    var wrap = document.createElement('div');
    wrap.id = 'pdfProgress';
    wrap.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(20,16,2,.42);';
    wrap.innerHTML =
      '<div style="background:var(--paper,#fffdf8);border-radius:16px;padding:22px 24px;width:min(92vw,380px);box-shadow:0 24px 60px -20px rgba(23,16,0,.55);">'
      + '  <div style="display:flex;align-items:center;gap:10px;">'
      + '    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="color:var(--gold-600,#b8860b);flex-shrink:0;"><path d="M6 17h12m-8-8v2m0-9V5m4 4h4m-4 4h2m-10 8h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + '    <strong style="font-size:.95rem;">Membuat dokumen cetak…</strong>'
      + '    <span id="pdfPct" style="margin-left:auto;font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;">0%</span>'
      + '  </div>'
      + '  <div style="margin-top:14px;height:10px;border-radius:999px;background:var(--paper-dim,#efe9d8);overflow:hidden;">'
      + '    <div id="pdfBar" style="height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#caa24a,#e8c766);transition:width .18s ease;"></div>'
      + '  </div>'
      + '  <div id="pdfStatus" class="small muted" style="margin-top:10px;">Menghubungi server…</div>'
      + '</div>';
    document.body.appendChild(wrap);
    pdfProgress = wrap;
  }
  function pdfProgressSet(pct, status){
    if(!pdfProgress) return;
    var bar = pdfProgress.querySelector('#pdfBar');
    var pctEl = pdfProgress.querySelector('#pdfPct');
    var stEl = pdfProgress.querySelector('#pdfStatus');
    var v = Math.max(0, Math.min(100, Math.round(pct)));
    if(bar) bar.style.width = v + '%';
    if(pctEl) pctEl.textContent = v + '%';
    if(stEl && status) stEl.textContent = status;
  }
  function pdfProgressHide(){
    if(!pdfProgress) return;
    var el = pdfProgress; pdfProgress = null;
    el.style.transition = 'opacity .25s'; el.style.opacity = '0';
    setTimeout(function(){ el.remove(); }, 260);
  }

  /* ---------- Cetak PDF resmi (dengan progres %) ---------- */
  async function cetakPdf(btn){
    var creep = null;
    try {
      if(btn){ btn.setAttribute('disabled','true'); }
      var kode = m ? m.kode_unik : (SIK.param('id') || '');
      if(!kode){ showToast('Data kartu tidak tersedia untuk dicetak.', 'danger'); return; }
      if(!SIKAPI.token()){ showToast('Silakan login terlebih dahulu.', 'danger'); return; }

      pdfProgressShow();
      /* Fase 1 — server merender kartu (puppeteer): progres merayap menuju 55%
         (server belum mengirim byte apa pun selama fase ini) */
      var t0 = Date.now();
      creep = setInterval(function(){
        var s = (Date.now() - t0) / 1000;
        pdfProgressSet(55 * (1 - Math.exp(-s / 5)), 'Server sedang merender kartu…');
      }, 120);

      var url = SIKAPI.base + '/vcard/pdf?kode=' + encodeURIComponent(String(kode).toUpperCase());
      var resp = await SIKAPI.raw(url);
      if(creep){ clearInterval(creep); creep = null; }

      var ctype = (resp.headers && resp.headers.get('content-type')) || '';
      if(!resp.ok){
        pdfProgressHide();
        var msg = 'gagal membuat dokumen';
        try {
          if(ctype.indexOf('application/json') !== -1){
            var j = await resp.json();
            if(j && j.error) msg = j.error;
          } else {
            var t = await resp.text();
            if(t) msg = t.slice(0, 160);
          }
        } catch(e){}
        throw new Error(msg + ' (HTTP ' + resp.status + ')');
      }
      if(ctype.indexOf('application/pdf') === -1 && ctype.indexOf('octet') === -1){
        /* server mengembalikan JSON padahal status 200 — anggap error */
        pdfProgressHide();
        try {
          var j2 = await resp.clone().json();
          throw new Error((j2 && j2.error) || 'respon server bukan PDF');
        } catch(e){
          if(e && e.message && e.message !== 'Unexpected end of JSON input') throw e;
        }
      }

      /* Fase 2 — unduh streaming: progres nyata dari Content-Length */
      var blob = null;
      var total = parseInt((resp.headers && (resp.headers.get('content-length') || '')) || '0', 10);
      if(resp.body && resp.body.getReader && total > 0){
        var reader = resp.body.getReader();
        var chunks = [], received = 0;
        while(true){
          var r = await reader.read();
          if(r.done) break;
          chunks.push(r.value); received += r.value.byteLength;
          pdfProgressSet(55 + 44 * (received / total),
            'Mengunduh PDF… ' + (received / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB');
        }
        blob = new Blob(chunks, { type: 'application/pdf' });
      } else {
        /* fallback tanpa stream/Content-Length — rayap 55→95 lalu selesai */
        var t1 = Date.now();
        var creep2 = setInterval(function(){
          var s2 = (Date.now() - t1) / 1000;
          pdfProgressSet(55 + 40 * (1 - Math.exp(-s2 / 2)), 'Mengunduh PDF…');
        }, 120);
        blob = await resp.blob();
        clearInterval(creep2);
      }
      pdfProgressSet(100, 'Selesai — membuka dokumen…');
      if(!blob || blob.size < 1024){ throw new Error('berkas PDF kosong / rusak'); }
      var blobUrl = URL.createObjectURL(new Blob([blob], { type: 'application/pdf' }));
      var win = window.open(blobUrl, '_blank');
      if(!win){
        /* popup diblokir — tawarkan unduhan langsung */
        var a = document.createElement('a');
        a.href = blobUrl;
        a.download = 'kartu-anggota-' + String(kode).toLowerCase() + '.pdf';
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast('Pop-up ditahan — PDF diunduh langsung.', 'info', 4000);
      } else {
        showToast('Dokumen cetak resmi SIKEDA dibuka di tab baru.', 'success', 3000);
        setTimeout(function(){ URL.revokeObjectURL(blobUrl); }, 60000);
      }
      setTimeout(pdfProgressHide, 700);
    } catch(e){
      pdfProgressHide();
      showToast('Gagal membuat cetakan: ' + (e && e.message ? e.message : 'kesalahan'), 'danger', 5000);
    } finally {
      if(creep){ clearInterval(creep); }
      if(btn){ btn.removeAttribute('disabled'); }
    }
  }

  /* ---------- Unduh .vcf ---------- */
  function saveVcf(){
    var ORGNAME = (ORG && ORG.nama ? ORG.nama : 'DPD Nusantara Bersatu') + (ORG && ORG.wilayah ? ' — ' + ORG.wilayah : '');
    var vcf = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:' + m.nama.split(' ').reverse().join(';') + ';;;',
      'FN:' + m.nama,
      'ORG:' + ORGNAME,
      'TITLE:' + (m.jabatan !== '—' ? m.jabatan : 'Anggota'),
      'TEL;TYPE=CELL:' + (m.whatsapp || ''),
      'URL:' + m.url,
      'NOTE:Anggota ' + ORGNAME + ' · ID ' + m.kode_unik,
      'END:VCARD'
    ].join('\r\n');
    var blob = new Blob([vcf], { type:'text/vcard;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = m.kode_unik + '.vcf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    showToast('Kontak (.vcf) diunduh — buka untuk menyimpan.', 'success');
  }

  /* ---------- Bagikan ---------- */
  function shareLink(){
    if(navigator.share){
      navigator.share({ title:'Kartu Anggota — ' + m.nama, url: m.url }).catch(function(){});
      return;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(m.url).then(function(){ showToast('Tautan vCard disalin.', 'success'); });
      return;
    }
    var input = document.createElement('input');
    input.value = m.url;
    document.body.appendChild(input);
    input.select();
    try { document.execCommand('copy'); showToast('Tautan vCard disalin.', 'success'); }
    catch(e){ showToast('Gagal menyalin tautan.', 'danger'); }
    input.remove();
  }
</script>
</body>
