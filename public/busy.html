<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Antrian — SIKEDA</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --line:#e3e8f0; --ink:#1c2333; --muted:#64708a;
    --brand:#2f5fe0; --brand-soft:#e8eeff; --ok:#188a52; --warn:#c07f16;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    display:grid; place-items:center; padding:24px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    max-width:460px; width:100%; padding:36px 30px; text-align:center;
    box-shadow:0 10px 40px rgba(28,35,51,.07);
  }
  .ring{ position:relative; width:96px; height:96px; margin:0 auto 18px; }
  .ring svg{ transform:rotate(-90deg); }
  .ring .num{
    position:absolute; inset:0; display:grid; place-items:center;
    font-size:1.7rem; font-weight:700; color:var(--brand); font-variant-numeric:tabular-nums;
  }
  h1{ font-size:1.25rem; margin-bottom:8px; }
  p{ color:var(--muted); font-size:.9rem; line-height:1.55; }
  .reason{ margin-top:10px; font-size:.8rem; color:var(--muted); line-height:1.5; }
  .reason b{ color:var(--ink); }
  .state{ margin-top:14px; font-size:.8rem; padding:8px 14px; border-radius:999px; display:inline-block; }
  .state.wait{ background:var(--brand-soft); color:var(--brand); }
  .state.err{ background:#fdeaea; color:#b3261e; }
  .state.ok{ background:#e2f5ea; color:var(--ok); }
  .bar{ height:6px; background:var(--brand-soft); border-radius:999px; margin-top:20px; overflow:hidden; }
  .bar > i{ display:block; height:100%; width:35%; background:var(--brand); border-radius:999px; animation:slide 1.4s ease-in-out infinite; }
  @keyframes slide{ 0%{transform:translateX(-110%);} 100%{transform:translateX(420%);} }
  .btn{
    margin-top:20px; display:none; width:100%; padding:12px; border:0; border-radius:12px;
    background:var(--brand); color:#fff; font-weight:600; font-size:.95rem; cursor:pointer;
    text-decoration:none;
  }
  .btn:hover{ filter:brightness(1.07); }
  .tiny{ margin-top:14px; font-size:.72rem; color:var(--muted); }
</style>
</head>
<body>
<main class="card" role="status" aria-live="polite">
  <div class="ring">
    <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
      <circle cx="48" cy="48" r="42" stroke="var(--brand-soft)" stroke-width="8"/>
      <circle id="arc" cx="48" cy="48" r="42" stroke="var(--brand)" stroke-width="8" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="66"/>
    </svg>
    <div class="num" id="count">–</div>
  </div>
  <h1>Sistem sedang sibuk</h1>
  <p>Saat ini beban pengguna melebihi kapasitas. Permintaan Anda kami tempatkan dalam antrian dan halaman tujuan akan <b>terbuka otomatis</b> begitu sistem kembali normal.</p>
  <div class="reason" id="reason">Membaca kondisi sistem…</div>
  <div class="state wait" id="state">Mempantau beban sistem…</div>
  <div class="bar"><i></i></div>
  <button class="btn" id="go">Buka halaman tujuan</button>
  <button class="btn" id="reload" style="background:var(--muted);">Muat ulang halaman antrian</button>
  <p class="tiny" id="meta"></p>
</main>
<script>
(function(){
  'use strict';
  var qs = new URLSearchParams(location.search);
  var ret = qs.get('ret') || '/';
  if(!/^\/[^\f\r\n\v]*$/.test(ret)) ret = '/'; /* hanya path internal */
  var countEl = document.getElementById('count');
  var stateEl = document.getElementById('state');
  var reasonEl = document.getElementById('reason');
  var arcEl = document.getElementById('arc');
  var metaEl = document.getElementById('meta');
  var goBtn = document.getElementById('go');
  var reloadBtn = document.getElementById('reload');
  var CIRC = 264, PERIOD = 30; /* lingkaran penuh = 30 detik menunggu */
  var MAXWAIT = 180; /* setelah 3 menit, tawarkan muat ulang secara eksplisit */
  var waited = 0, stopped = false, fails = 0, lastData = null;

  function setRing(sec){
    var frac = (sec % PERIOD) / PERIOD;
    arcEl.setAttribute('stroke-dashoffset', String(Math.round(CIRC * frac)));
    countEl.textContent = sec >= PERIOD ? Math.floor(sec / 60) + 'm' : String(sec % PERIOD);
  }

  function reasonText(d){
    var lag = d.lagMs || 0, lagMax = d.maxLagMs || 0;
    var act = d.inflight || 0, actMax = d.maxConc || 0;
    if(d.state === 'recovering') return 'Sistem sudah pulih — menyelesaikan sisa antrian.';
    if(lagMax > 0 && lag >= lagMax) return 'Penyebab: jeda pemrosesan server tinggi — <b>' + lag + ' ms</b> (ambang ' + lagMax + ' ms).';
    if(actMax > 0 && act >= actMax) return 'Penyebab: banyak pengguna aktif bersamaan — <b>' + act + '</b> (ambang ' + actMax + ').';
    return 'Menunggu pembacaan beban stabil…';
  }

  function normal(state){
    if(stopped) return;
    stopped = true;
    stateEl.className = 'state ok';
    stateEl.textContent = 'Sistem normal — membuka halaman…';
    reasonEl.innerHTML = 'Anda akan diarahkan otomatis.';
    goBtn.style.display = 'block';
    goBtn.onclick = function(){ location.replace(ret); };
    setTimeout(function(){ location.replace(ret); }, 1200);
  }

  function showingCap(){ return waited >= MAXWAIT && !stopped; }

  async function poll(){
    if(stopped) return;
    try {
      var r = await fetch('/api/public/busy-status', { cache: 'no-store' });
      var j = await r.json();
      var d = (j && j.data) || {};
      lastData = d;
      fails = 0;
      if(!d.busy && d.state !== 'busy' && d.state !== 'recovering') return normal(d);
      stateEl.className = 'state wait';
      stateEl.textContent = (d.state === 'recovering')
        ? 'Sistem pulih — menyelesaikan antrian terakhir…'
        : 'Masih sibuk — menunggu beban turun…';
      reasonEl.innerHTML = reasonText(d);
      var t = [];
      if(d.inflight !== undefined && d.maxConc) t.push('aktif ' + d.inflight + '/' + d.maxConc);
      if(d.lagMs !== undefined && d.maxLagMs) t.push('jeda ' + d.lagMs + '/' + d.maxLagMs + ' ms');
      if(d.uptimeSecs !== undefined) t.push('umur sesi ' + d.uptimeSecs + ' dtk');
      metaEl.textContent = t.join(' · ') + ' — diperbarui otomatis.';
    } catch(e){
      fails++;
      if(fails >= 5 && !showingCap()){
        stateEl.className = 'state err';
        stateEl.textContent = 'Koneksi ke sistem tidak stabil.';
        reasonEl.textContent = 'Tidak bisa membaca status antrian. Periksa koneksi internet, lalu muat ulang.';
      }
    }
  }

  setRing(0);
  var tick = setInterval(function(){
    if(stopped){ clearInterval(tick); return; }
    waited++; setRing(waited);
    /* Poll adaptif: rapat di awal (2 dtk), melonggarkan setelah 20 dtk (4 dtk). */
    if(waited <= 20 || waited % 2 === 0) poll();
    if(showingCap()){
      reloadBtn.style.display = 'block';
      reasonEl.innerHTML = 'Antrian lebih lama dari biasanya. Anda bisa tetap menunggu, atau <b>muat ulang</b> untuk mengecek ulang dari awal.';
    }
    if(waited >= 300 && !stopped){ location.reload(); } /* jaring pengaman terakhir */
  }, 1000);
  reloadBtn.onclick = function(){ location.reload(); };
  poll();
})();
</script>
</body>
</html>
