# ============================================================
# SIKEDA — Render Blueprint
# Deploy: dashboard Render → New → Blueprint → pilih repo/folder ini
# Semua layanan di bawah dibuat otomatis (termasuk Persistent Disk).
# ============================================================
services:
  - type: web
    name: sikeda
    runtime: node
    plan: starter            # Free tidak mendukung Persistent Disk & lambat untuk puppeteer
    region: singapore        # terdekat dengan Indonesia
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    disk:                    # foto anggota & latar kartu tetap aman antar deploy
      name: sikeda-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: DB_HOST
        sync: false          # diisi manual di dashboard: ***REDACTED-DB-HOST***
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false          # ***REDACTED-DB-USER***
      - key: DB_PASSWORD
        sync: false          # jangan pernah di-commit
      - key: DB_NAME
        sync: false          # ***REDACTED-DB-NAME***
      - key: JWT_SECRET
        generateValue: true  # acak otomatis sekali saat pertama
      - key: NIK_ENC_KEY
        sync: false          # WAJIB sama dengan .env versi lama agar NIK terbaca
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: APP_URL
        sync: false          # https://sikeda.onrender.com (atau domain kustom)
      - key: CORS_ORIGINS
        value: ""
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "0"
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES
        value: "8h"
      - key: DEMO_LOGIN
        value: "off"
